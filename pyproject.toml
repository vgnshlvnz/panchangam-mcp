[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "panchangam-mcp"
version = "0.1.0"
description = "MCP server exposing Hindu almanac (panchangam) calculations as tools"
requires-python = ">=3.10"
dependencies = [
    "mcp==1.29.1",
    "pyswisseph>=2.10,<3",
    # Streamable-HTTP transport. Both are already transitive deps of mcp; listed
    # explicitly because panchangam.server imports them directly.
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "anyio>=4.0",
    "httpx>=0.27",
]

[project.scripts]
panchangam-mcp = "panchangam.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/panchangam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
